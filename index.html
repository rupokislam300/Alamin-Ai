<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alamin AI</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#18202f}
header{padding:18px 6%;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
.logo{font-size:25px;font-weight:bold;color:#5146e5}
.hero{text-align:center;padding:55px 15px 30px}
.hero h1{font-size:42px}
.wrap{max-width:850px;margin:auto;padding:20px}
.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 25px #0001}
.chat{height:330px;overflow:auto;border:1px solid #ddd;padding:12px;border-radius:14px}
.msg{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}
.ai{background:#eef0ff}
.user{background:#5146e5;color:white;margin-left:20%}
form{display:flex;gap:10px;margin-top:12px}
input{flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{background:#5146e5;color:white;border:0;border-radius:10px;padding:0 20px;font-weight:bold}
@media(max-width:600px){.hero h1{font-size:34px}form{flex-direction:column}button{height:48px}.user{margin-left:5%}}
</style>
</head>

<body>
<header>
<div class="logo">🤖 Alamin AI</div>
<div>Your AI, Your Way</div>
</header>

<section class="hero">
<h1>Alamin AI</h1>
<p>আপনার নিজের AI Assistant</p>
</section>

<main class="wrap">
<div class="card">
<h2>💬 AI Chat</h2>

<div id="chat" class="chat">
<div class="msg ai">আসসালামু আলাইকুম! আমি Alamin AI। আপনার প্রশ্ন লিখুন।</div>
</div>

<form id="form">
<input id="q" placeholder="আপনার প্রশ্ন লিখুন...">
<button type="submit">Send</button>
</form>
</div>
</main>

<script>
const form=document.getElementById("form");
const q=document.getElementById("q");
const chat=document.getElementById("chat");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",async function(e){
  e.preventDefault();

  const message=q.value.trim();
  if(!message)return;

  q.value="";
  addMessage(message,"user");

  const thinking=document.createElement("div");
  thinking.className="msg ai";
  thinking.textContent="ভাবছি...";
  chat.appendChild(thinking);

  try{
    const response=await fetch("https://alamin-ai-2.onrender.com/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:message})
    });

    const data=await response.json();

    thinking.textContent=data.answer || data.error || "কোনো উত্তর পাওয়া যায়নি।";

  }catch(error){
    thinking.textContent="AI server-এর সাথে যোগাযোগ করা যাচ্ছে না।";
  }
});
</script>

</body>
</html>
