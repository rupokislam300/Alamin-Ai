<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALAMIN: HUMAN FIGHT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061b20;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:12px;
  color:white;
  background:rgba(0,0,0,.45);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
  font-size:18px;
}

.stats{
  display:flex;
  gap:12px;
}

.barBox{
  margin-top:7px;
}

.bar{
  height:13px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #ffffff55;
}

.fill{
  height:100%;
  width:100%;
  transition:.15s;
}

.playerHP{
  background:#20d66b;
}

.enemyHP{
  background:#ff3348;
}

.label{
  font-size:11px;
  margin-bottom:2px;
}

#message{
  position:fixed;
  top:92px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:white;
  background:#001b20dd;
  padding:9px 16px;
  border-radius:22px;
  white-space:nowrap;
  font-size:14px;
}

#move{
  position:fixed;
  left:15px;
  bottom:18px;
  width:190px;
  height:145px;
  z-index:20;
}

.moveBtn{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:17px;
  border:1px solid #ffffff66;
  background:#073943dd;
  color:white;
  font-size:25px;
}

.up{left:66px;top:0}
.left{left:0;top:62px}
.down{left:66px;top:62px}
.right{left:132px;top:62px}

#fightButtons{
  position:fixed;
  right:15px;
  bottom:18px;
  width:190px;
  height:180px;
  z-index:20;
}

.attack{
  position:absolute;
  border:2px solid #ffffff88;
  color:white;
  font-weight:bold;
  border-radius:50%;
  touch-action:none;
}

#punch{
  right:100px;
  bottom:85px;
  width:72px;
  height:72px;
  background:#e43c43;
}

#kick{
  right:10px;
  bottom:85px;
  width:72px;
  height:72px;
  background:#e47725;
}

#special{
  right:55px;
  bottom:0;
  width:82px;
  height:82px;
  background:#158fa5;
  font-size:17px;
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
  color:white;
  background:rgba(0,0,0,.88);
  text-align:center;
}

#gameOver h1{
  font-size:42px;
}

#restart{
  padding:13px 25px;
  border:0;
  border-radius:12px;
  font-size:18px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="top">
    <div>🌿 ALAMIN: HUMAN FIGHT</div>

    <div class="stats">
      <span>❤️ <b id="score">0</b></span>
      <span>⭐ <b id="points">0</b></span>
    </div>
  </div>

  <div class="barBox">
    <div class="label">PLAYER ❤️</div>
    <div class="bar">
      <div id="playerBar" class="fill playerHP"></div>
    </div>
  </div>

  <div class="barBox">
    <div class="label">ENEMY 👹</div>
    <div class="bar">
      <div id="enemyBar" class="fill enemyHP"></div>
    </div>
  </div>

</div>

<div id="message">
  👊 শত্রুর কাছে গিয়ে আক্রমণ করুন
</div>

<div id="move">
  <button class="moveBtn up" data-key="up">▲</button>
  <button class="moveBtn left" data-key="left">◀</button>
  <button class="moveBtn down" data-key="down">▼</button>
  <button class="moveBtn right" data-key="right">▶</button>
</div>

<div id="fightButtons">

  <button id="punch" class="attack">
    👊<br>PUNCH
  </button>

  <button id="kick" class="attack">
    🦵<br>KICK
  </button>

  <button id="special" class="attack">
    ⚡<br>SPECIAL
  </button>

</div>

<div id="gameOver">

  <h1 id="result">GAME OVER</h1>

  <div>
    Score:
    <b id="finalScore">0</b>
  </div>

  <button id="restart">
    🔄 আবার খেলুন
  </button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}

resize();
addEventListener("resize",resize);


/* -------------------------
   GAME DATA
------------------------- */

const keys={
  up:false,
  down:false,
  left:false,
  right:false
};

const player={
  x:500,
  y:500,
  hp:100,
  maxHp:100,
  speed:4,
  radius:20,
  direction:"right",
  attack:0,
  attackType:"",
  cooldown:0,
  energy:100
};

const enemy={
  x:700,
  y:500,
  hp:100,
  maxHp:100,
  radius:22,
  speed:1.35,
  attackCooldown:0,
  hurt:0,
  dead:false
};

let score=0;
let points=0;
let gameRunning=true;
let cameraX=0;
let cameraY=0;
let hitEffect=0;
let messageTimer=0;


/* -------------------------
   WORLD
------------------------- */

const trees=[];

for(let i=0;i<90;i++){

  trees.push({
    x:Math.random()*1800,
    y:Math.random()*1800,
    r:25+Math.random()*35
  });

}


/* -------------------------
   HELPERS
------------------------- */

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function showMessage(text){

  document.getElementById("message").textContent=text;
  messageTimer=100;

}


/* -------------------------
   TOUCH MOVEMENT
------------------------- */

document.querySelectorAll(".moveBtn").forEach(button=>{

  const key=button.dataset.key;

  button.addEventListener("touchstart",e=>{
    e.preventDefault();
    keys[key]=true;
  },{passive:false});

  button.addEventListener("touchend",e=>{
    e.preventDefault();
    keys[key]=false;
  },{passive:false});

  button.addEventListener("mousedown",()=>{
    keys[key]=true;
  });

  button.addEventListener("mouseup",()=>{
    keys[key]=false;
  });

});


/* -------------------------
   KEYBOARD
------------------------- */

addEventListener("keydown",e=>{

  if(e.key==="ArrowUp" || e.key==="w") keys.up=true;
  if(e.key==="ArrowDown" || e.key==="s") keys.down=true;
  if(e.key==="ArrowLeft" || e.key==="a") keys.left=true;
  if(e.key==="ArrowRight" || e.key==="d") keys.right=true;

  if(e.key==="j") punch();
  if(e.key==="k") kick();
  if(e.key==="l") special();

});

addEventListener("keyup",e=>{

  if(e.key==="ArrowUp" || e.key==="w") keys.up=false;
  if(e.key==="ArrowDown" || e.key==="s") keys.down=false;
  if(e.key==="ArrowLeft" || e.key==="a") keys.left=false;
  if(e.key==="ArrowRight" || e.key==="d") keys.right=false;

});


/* -------------------------
   PLAYER MOVEMENT
------------------------- */

function movePlayer(){

  if(!gameRunning)return;

  let dx=0;
  let dy=0;

  if(keys.left)dx--;
  if(keys.right)dx++;
  if(keys.up)dy--;
  if(keys.down)dy++;

  if(dx!==0 || dy!==0){

    const length=Math.hypot(dx,dy);

    dx/=length;
    dy/=length;

    player.x+=dx*player.speed;
    player.y+=dy*player.speed;

    if(Math.abs(dx)>Math.abs(dy)){
      player.direction=dx>0?"right":"left";
    }else{
      player.direction=dy>0?"down":"up";
    }

  }

  player.x=clamp(player.x,40,1760);
  player.y=clamp(player.y,100,1760);

}


/* -------------------------
   ATTACK SYSTEM
------------------------- */

function attack(type){

  if(!gameRunning)return;

  if(player.cooldown>0)return;

  const d=distance(player,enemy);

  if(d>105){

    showMessage("⚠️ শত্রুর আরও কাছে যান");

    return;
  }

  player.attack=12;
  player.attackType=type;

  let damage=0;

  if(type==="punch")damage=15;
  if(type==="kick")damage=25;

  enemy.hp-=damage;
  enemy.hurt=10;

  hitEffect=8;

  score+=damage;
  points+=damage;

  player.cooldown=18;

  if(type==="punch"){
    showMessage("👊 PUNCH! -" + damage + " HP");
  }

  if(type==="kick"){
    showMessage("🦵 KICK! -" + damage + " HP");
  }

  checkEnemy();

}


function punch(){
  attack("punch");
}

function kick(){
  attack("kick");
}


/* -------------------------
   SPECIAL ATTACK
------------------------- */

function special(){

  if(!gameRunning)return;

  if(player.energy<30){

    showMessage("⚡ Energy কম!");

    return;
  }

  const d=distance(player,enemy);

  if(d>150){

    showMessage("⚠️ Special Attack-এর জন্য কাছে যান");

    return;
  }

  player.energy-=30;

  player.attack=18;
  player.attackType="special";

  enemy.hp-=45;
  enemy.hurt=15;

  hitEffect=15;

  score+=45;
  points+=45;

  showMessage("⚡ SPECIAL ATTACK! -45 HP");

  checkEnemy();

}


/* -------------------------
   ENEMY
------------------------- */

function enemyAI(){

  if(enemy.dead)return;

  const d=distance(player,enemy);

  if(d<280){

    const dx=(player.x-enemy.x)/d;
    const dy=(player.y-enemy.y)/d;

    if(d>65){

      enemy.x+=dx*enemy.speed;
      enemy.y+=dy*enemy.speed;

    }else{

      if(enemy.attackCooldown<=0){

        player.hp-=8;
        enemy.attackCooldown=65;

        hitEffect=5;

        showMessage("💢 Enemy আক্রমণ করেছে! -8 HP");

      }

    }

  }

  if(enemy.attackCooldown>0){
    enemy.attackCooldown--;
  }

}


/* -------------------------
   CHECK ENEMY
------------------------- */

function checkEnemy(){

  if(enemy.hp<=0){

    enemy.hp=0;
    enemy.dead=true;

    score+=500;
    points+=500;

    showMessage("🏆 ENEMY DEFEATED!");

    setTimeout(()=>{
      winGame();
    },900);

  }

}


/* -------------------------
   GAME END
------------------------- */

function winGame(){

  gameRunning=false;

  document.getElementById("result").textContent="🏆 YOU WIN!";
  document.getElementById("finalScore").textContent=score;
  document.getElementById("gameOver").style.display="flex";

}


function loseGame(){

  gameRunning=false;

  document.getElementById("result").textContent="💀 GAME OVER";
  document.getElementById("finalScore").textContent=score;
  document.getElementById("gameOver").style.display="flex";

}


/* -------------------------
   BUTTONS
------------------------- */

function pressButton(id,fn){

  const b=document.getElementById(id);

  b.addEventListener("touchstart",e=>{
    e.preventDefault();
    fn();
  },{passive:false});

  b.addEventListener("mousedown",e=>{
    e.preventDefault();
    fn();
  });

}

pressButton("punch",punch);
pressButton("kick",kick);
pressButton("special",special);

document.getElementById("restart").onclick=()=>{
  location.reload();
};


/* -------------------------
   UPDATE
------------------------- */

function update(){

  if(!gameRunning)return;

  movePlayer();
  enemyAI();

  if(player.attack>0){
    player.attack--;
  }

  if(player.cooldown>0){
    player.cooldown--;
  }

  if(enemy.hurt>0){
    enemy.hurt--;
  }

  if(hitEffect>0){
    hitEffect--;
  }

  player.energy=clamp(
    player.energy+0.15,
    0,
    100
  );

  if(messageTimer>0){

    messageTimer--;

    if(messageTimer===0){
      showMessage("👊 শত্রুর কাছে গিয়ে আক্রমণ করুন");
    }

  }

  if(player.hp<=0){
    player.hp=0;
    loseGame();
  }


  /* CAMERA */

  cameraX=player.x-W/2;
  cameraY=player.y-H/2;

  cameraX=clamp(cameraX,0,1800-W);
  cameraY=clamp(cameraY,0,1800-H);


  /* HUD */

  document.getElementById("playerBar").style.width=
    player.hp+"%";

  document.getElementById("enemyBar").style.width=
    enemy.hp+"%";

  document.getElementById("score").textContent=
    Math.floor(player.hp);

  document.getElementById("points").textContent=
    points;

}


/* -------------------------
   DRAW BACKGROUND
------------------------- */

function drawBackground(){

  ctx.fillStyle="#073d3b";
  ctx.fillRect(0,0,W,H);

  for(let x=-cameraX%150;x<W;x+=150){

    for(let y=-cameraY%150;y<H;y+=150){

      ctx.fillStyle="#0a504b";

      ctx.beginPath();
      ctx.arc(
        x+40,
        y+40,
        72,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  /* trees */

  for(const t of trees){

    const x=t.x-cameraX;
    const y=t.y-cameraY;

    if(x<-80 || x>W+80 || y<-80 || y>H+80){
      continue;
    }

    ctx.fillStyle="#563b24";
    ctx.fillRect(x-6,y+15,12,35);

    ctx.fillStyle="#15563a";

    ctx.beginPath();
    ctx.arc(x,y,t.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#1d7047";

    ctx.beginPath();
    ctx.arc(
      x-15,
      y-15,
      t.r*.65,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* -------------------------
   DRAW HUMAN
------------------------- */

function drawHuman(x,y,color,enemyCharacter=false){

  ctx.save();

  ctx.translate(x,y);


  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.4)";

  ctx.beginPath();
  ctx.ellipse(
    0,
    30,
    23,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.fillStyle="#171b22";

  ctx.fillRect(-11,10,8,25);
  ctx.fillRect(3,10,8,25);


  /* body */

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.roundRect(
    -17,
    -12,
    34,
    30,
    8
  );

  ctx.fill();


  /* arms */

  ctx.strokeStyle="#e0a07c";
  ctx.lineWidth=8;
  ctx.lineCap="round";


  ctx.beginPath();

  ctx.moveTo(-15,-5);

  if(
    !enemyCharacter &&
    player.attack>0 &&
    player.attackType!=="kick"
  ){
    ctx.lineTo(-42,-5);
  }else{
    ctx.lineTo(-25,12);
  }

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(15,-5);

  if(
    !enemyCharacter &&
    player.attack>0 &&
    player.attackType!=="kick"
  ){
    ctx.lineTo(42,-5);
  }else{
    ctx.lineTo(25,12);
  }

  ctx.stroke();


  /* neck */

  ctx.fillStyle="#e0a07c";
  ctx.fillRect(-6,-22,12,12);


  /* head */

  ctx.beginPath();

  ctx.arc(
    0,
    -31,
    16,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  ctx.fillStyle="#211914";

  ctx.beginPath();

  ctx.arc(
    0,
    -35,
    16,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* eyes */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(-6,-31,2.2,0,Math.PI*2);
  ctx.arc(6,-31,2.2,0,Math.PI*2);

  ctx.fill();


  /* attack effect */

  if(
    !enemyCharacter &&
    player.attack>0 &&
    player.attackType==="special"
  ){

    ctx.strokeStyle="#55eeff";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.arc(
      0,
      -5,
      52,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* -------------------------
   DRAW ENEMY HP
------------------------- */

function drawEnemyHP(x,y){

  if(enemy.dead)return;

  ctx.fillStyle="#111";

  ctx.fillRect(
    x-35,
    y-65,
    70,
    8
  );

  ctx.fillStyle="#ff3045";

  ctx.fillRect(
    x-35,
    y-65,
    70*(enemy.hp/enemy.maxHp),
    8
  );

}


/* -------------------------
   DRAW
------------------------- */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();


  /* Enemy */

  if(!enemy.dead){

    const ex=enemy.x-cameraX;
    const ey=enemy.y-cameraY;

    drawHuman(
      ex,
      ey,
      enemy.hurt>0 ? "#ff6b75" : "#a92735",
      true
    );

    drawEnemyHP(ex,ey);

  }


  /* Player */

  const px=player.x-cameraX;
  const py=player.y-cameraY;

  drawHuman(
    px,
    py,
    "#2678ed",
    false
  );


  /* Hit flash */

  if(hitEffect>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      (hitEffect/30)+")";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }

}


/* -------------------------
   GAME LOOP
------------------------- */

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
