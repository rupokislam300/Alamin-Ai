<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Alamin: Sky Forest</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="hud">
  <b>🌿 ALAMIN: SKY FOREST</b>

  <span>
    ❤️ <i id="hp">100</i>
    ⚡ <i id="energy">100</i>
    ⭐ <i id="score">0</i>
  </span>
</div>

<canvas id="game"></canvas>

<div id="mission">
  ৫টি Crystal সংগ্রহ করে নীল Portal-এ পৌঁছাও
</div>

<div id="controls">

  <button data-k="ArrowUp">▲</button>

  <div>
    <button data-k="ArrowLeft">◀</button>
    <button id="power">⚡</button>
    <button data-k="ArrowRight">▶</button>
  </div>

  <button data-k="ArrowDown">▼</button>

</div>

<div id="menu">

  <div class="card">

    <h1>🌿 ALAMIN: SKY FOREST</h1>

    <p id="msg">
      একটি Fantasy Adventure Demo
    </p>

    <button id="start">
      START GAME
    </button>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
