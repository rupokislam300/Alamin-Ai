<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Alamin Human Fighter</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#071b20;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}

#hud{
 position:fixed;top:0;left:0;width:100%;z-index:5;
 padding:12px;color:white;background:#0006;
 display:flex;justify-content:space-between;font-weight:bold
}
#stats{display:flex;gap:10px}

#message{
 position:fixed;top:58px;left:50%;transform:translateX(-50%);
 z-index:5;background:#000b;color:white;padding:8px 15px;
 border-radius:20px;font-size:13px;white-space:nowrap
}

#controls{
 position:fixed;bottom:15px;left:15px;width:210px;height:160px;z-index:10
}
.btn{
 position:absolute;width:60px;height:60px;border-radius:18px;
 border:1px solid #fff5;background:#123d46dd;color:white;
 font-size:25px;touch-action:none
}
.up{left:75px;top:0}.left{left:0;top:65px}
.down{left:75px;top:65px}.right{left:150px;top:65px}

#fight{
 position:fixed;right:20px;bottom:95px;
 width:82px;height:82px;border-radius:50%;
 border:3px solid #fff8;background:#c52d3d;color:white;
 font-size:20px;font-weight:bold;z-index:10;
 box-shadow:0 0 20px #f33
}

#power{
 position:fixed;right:30px;bottom:20px;
 width:62px;height:62px;border-radius:50%;
 border:2px solid #fff8;background:#168ca0;color:white;
 font-size:25px;z-index:10
}

#gameover{
 display:none;position:fixed;inset:0;z-index:20;
 background:#000d;color:white;align-items:center;
 justify-content:center;flex-direction:column;gap:18px
}
#gameover button{
 padding:13px 25px;border:0;border-radius:12px;font-size:18px
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div>🌿 ALAMIN FIGHTER</div>
 <div id="stats">
  <span>❤️<b id="hp">100</b></span>
  <span>⚡<b id="energy">100</b></span>
  <span>⭐<b id="score">0</b></span>
 </div>
</div>

<div id="message">👊 শত্রুর কাছে গিয়ে FIGHT চাপুন</div>

<div id="controls">
 <button class="btn up" data-k="up">▲</button>
 <button class="btn left" data-k="left">◀</button>
 <button class="btn down" data-k="down">▼</button>
 <button class="btn right" data-k="right">▶</button>
</div>

<button id="fight">👊<br>FIGHT</button>
<button id="power">⚡</button>

<div id="gameover">
 <h1>GAME OVER</h1>
 <p>Score: <b id="finalScore">0</b></p>
 <button onclick="location.reload()">আবার খেলুন</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let W,H;
function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const keys={up:0,down:0,left:0,right:0};

let score=0;
let crystals=0;
let running=true;
let attackTimer=0;
let hitFlash=0;

const player={
 x:1300,y:1300,
 hp:100,energy:100,
 speed:3.2,
 radius:18,
 dir:"down"
};

const enemies=[];
const people=[];
const crystalsList=[];
const trees=[];

const portal={x:2250,y:350,r:45};

function rnd(a,b){return Math.random()*(b-a)+a}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

/* PEOPLE */

const colors=["#2878e8","#e83e58","#e69b25","#8a54d9","#18a875"];

for(let i=0;i<14;i++){
 people.push({
  x:rnd(100,2500),y:rnd(150,2500),
  color:colors[i%colors.length],
  dx:rnd(-1,1),dy:rnd(-1,1),
  timer:rnd(50,150)
 });
}

/* ENEMIES */

for(let i=0;i<10;i++){
 enemies.push({
  x:rnd(300,2300),
  y:rnd(400,2300),
  hp:60,
  maxHp:60,
  attack:0,
  speed:1.15,
  dead:false
 });
}

/* CRYSTALS */

for(let i=0;i<15;i++){
 crystalsList.push({
  x:rnd(150,2450),
  y:rnd(150,2450),
  got:false
 });
}

/* TREES */

for(let i=0;i<120;i++){
 trees.push({
  x:rnd(30,2570),
  y:rnd(100,2570),
  r:rnd(25,55)
 });
}

/* CAMERA */

const camera={x:0,y:0};

function human(x,y,color,scale=1,enemy=false){

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);

 /* shadow */
 ctx.fillStyle="#0005";
 ctx.beginPath();
 ctx.ellipse(0,27,17,7,0,0,Math.PI*2);
 ctx.fill();

 /* legs */
 ctx.fillStyle="#20252b";
 ctx.fillRect(-10,9,7,20);
 ctx.fillRect(3,9,7,20);

 /* body */
 ctx.fillStyle=enemy?"#9c2631":color;
 ctx.beginPath();
 ctx.roundRect(-15,-9,30,27,7);
 ctx.fill();

 /* arms */
 ctx.strokeStyle="#dda17b";
 ctx.lineWidth=7;
 ctx.lineCap="round";

 ctx.beginPath();
 ctx.moveTo(-14,-3);
 ctx.lineTo(-23,10);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(14,-3);
 ctx.lineTo(23,10);
 ctx.stroke();

 /* neck */
 ctx.fillStyle="#dda17b";
 ctx.fillRect(-5,-17,10,8);

 /* head */
 ctx.beginPath();
 ctx.arc(0,-26,14,0,Math.PI*2);
 ctx.fill();

 /* hair */
 ctx.fillStyle="#201914";
 ctx.beginPath();
 ctx.arc(0,-31,14,Math.PI,Math.PI*2);
 ctx.fill();

 /* eyes */
 ctx.fillStyle="#111";
 ctx.beginPath();
 ctx.arc(-5,-26,2,0,7);
 ctx.arc(5,-26,2,0,7);
 ctx.fill();

 /* attack arm */
 if(!enemy && attackTimer>0){
  ctx.strokeStyle="#fff";
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.moveTo(14,-3);
  ctx.lineTo(42,-3);
  ctx.stroke();
 }

 ctx.restore();
}

function background(){

 ctx.fillStyle="#0b4b43";
 ctx.fillRect(0,0,W,H);

 for(let x=-camera.x%160;x<W;x+=160){
  for(let y=-camera.y%160;y<H;y+=160){
   ctx.fillStyle="#0d594b";
   ctx.beginPath();
   ctx.arc(x+40,y+40,75,0,7);
   ctx.fill();
  }
 }

 for(const t of trees){

  const x=t.x-camera.x;
  const y=t.y-camera.y;

  if(x<-80||x>W+80||y<-80||y>H+80)continue;

  ctx.fillStyle="#543a25";
  ctx.fillRect(x-6,y+10,12,32);

  ctx.fillStyle="#155b3b";
  ctx.beginPath();
  ctx.arc(x,y,t.r,0,7);
  ctx.fill();

  ctx.fillStyle="#21724a";
  ctx.beginPath();
  ctx.arc(x-12,y-13,t.r*.65,0,7);
  ctx.fill();
 }
}

function crystal(o){

 const x=o.x-camera.x;
 const y=o.y-camera.y;

 ctx.shadowBlur=18;
 ctx.shadowColor="#5df5ff";
 ctx.fillStyle="#5defff";

 ctx.beginPath();
 ctx.moveTo(x,y-18);
 ctx.lineTo(x+13,y);
 ctx.lineTo(x,y+18);
 ctx.lineTo(x-13,y);
 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;
}

function drawPortal(){

 const x=portal.x-camera.x;
 const y=portal.y-camera.y;

 ctx.strokeStyle="#55eaff";
 ctx.lineWidth=10;
 ctx.shadowBlur=25;
 ctx.shadowColor="#00eaff";

 ctx.beginPath();
 ctx.arc(x,y,portal.r,0,7);
 ctx.stroke();

 ctx.shadowBlur=0;
}

/* INPUT */

document.querySelectorAll(".btn").forEach(b=>{
 const k=b.dataset.k;

 const down=e=>{
  e.preventDefault();
  keys[k]=1;
 };

 const up=e=>{
  e.preventDefault();
  keys[k]=0;
 };

 b.addEventListener("touchstart",down,{passive:false});
 b.addEventListener("touchend",up,{passive:false});
 b.addEventListener("mousedown",down);
 b.addEventListener("mouseup",up);
});

addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=1;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=1;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=1;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=1;
 if(e.key===" "||e.key==="Enter")fight();
});

addEventListener("keyup",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=0;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=0;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=0;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=0;
});

/* FIGHT */

function fight(){

 if(!running||attackTimer>0)return;

 attackTimer=16;

 let target=null;
 let nearest=999;

 for(const e of enemies){

  if(e.dead)continue;

  const d=dist(player,e);

  if(d<75 && d<nearest){
   nearest=d;
   target=e;
  }
 }

 if(target){

  target.hp-=25;
  hitFlash=8;

  score+=10;

  document.getElementById("message").textContent=
   "💥 আঘাত! শত্রুর HP: "+Math.max(0,target.hp);

  if(target.hp<=0){

   target.dead=true;
   score+=100;

   document.getElementById("message").textContent=
    "🏆 শত্রু পরাজিত! +100 Score";
  }

 }else{

  document.getElementById("message").textContent=
   "👊 কাছাকাছি কোনো শত্রু নেই";
 }
}

document.getElementById("fight").addEventListener("touchstart",e=>{
 e.preventDefault();
 fight();
},{passive:false});

document.getElementById("fight").addEventListener("mousedown",fight);

/* SPECIAL ATTACK */

function special(){

 if(player.energy<30||!running)return;

 player.energy-=30;

 let hit=0;

 for(const e of enemies){

  if(!e.dead&&dist(player,e)<150){

   e.hp-=45;
   hit++;

   if(e.hp<=0){
    e.dead=true;
    score+=150;
   }
  }
 }

 document.getElementById("message").textContent=
  hit ? "⚡ SPECIAL ATTACK! "+hit+" শত্রুতে আঘাত!"
      : "⚡ Special attack ব্যবহার হয়েছে!";
}

document.getElementById("power").onclick=special;

/* UPDATE */

function update(){

 if(!running)return;

 let dx=0,dy=0;

 if(keys.left)dx--;
 if(keys.right)dx++;
 if(keys.up)dy--;
 if(keys.down)dy++;

 if(dx||dy){

  const n=Math.hypot(dx,dy);
  dx/=n;dy/=n;

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

  if(Math.abs(dx)>Math.abs(dy))
   player.dir=dx>0?"right":"left";
  else
   player.dir=dy>0?"down":"up";
 }

 player.x=Math.max(40,Math.min(2560,player.x));
 player.y=Math.max(80,Math.min(2560,player.y));

 player.energy=Math.min(100,player.energy+.25);

 if(attackTimer>0)attackTimer--;
 if(hitFlash>0)hitFlash--;

 /* NPC */

 for(const p of people){

  p.timer--;

  if(p.timer<=0){
   p.dx=rnd(-1,1);
   p.dy=rnd(-1,1);
   p.timer=rnd(50,160);
  }

  p.x+=p.dx*.3;
  p.y+=p.dy*.3;
 }

 /* ENEMIES */

 for(const e of enemies){

  if(e.dead)continue;

  const d=dist(player,e);

  if(d<280){

   const dx=(player.x-e.x)/d;
   const dy=(player.y-e.y)/d;

   e.x+=dx*e.speed;
   e.y+=dy*e.speed;

   if(d<45&&e.attack<=0){

    player.hp-=6;
    e.attack=50;

    document.getElementById("message").textContent=
     "💢 শত্রু তোমাকে আঘাত করেছে!";
   }

  }else{

   e.x+=Math.sin(Date.now()/900+e.x)*.2;
   e.y+=Math.cos(Date.now()/900+e.y)*.2;
  }

  if(e.attack>0)e.attack--;
 }

 /* CRYSTALS */

 for(const o of crystalsList){

  if(!o.got&&dist(player,o)<35){

   o.got=true;
   crystals++;
   score+=50;

   document.getElementById("message").textContent=
    "💎 Crystal সংগ্রহ! "+crystals+"/5";
  }
 }

 /* PORTAL */

 if(dist(player,portal)<65){

  if(crystals>=5){

   score+=500;
   crystals=0;

   crystalsList.forEach(o=>o.got=false);

   player.x=1300;
   player.y=1300;

   document.getElementById("message").textContent=
    "🎉 LEVEL COMPLETE! নতুন Level!";
  }
 }

 if(player.hp<=0){

  running=false;

  document.getElementById("finalScore").textContent=score;
  document.getElementById("gameover").style.display="flex";
 }

 document.getElementById("hp").textContent=
  Math.max(0,Math.floor(player.hp));

 document.getElementById("energy").textContent=
  Math.floor(player.energy);

 document.getElementById("score").textContent=score;

 /* CAMERA */

 camera.x=player.x-W/2;
 camera.y=player.y-H/2;

 camera.x=Math.max(0,Math.min(2600-W,camera.x));
 camera.y=Math.max(0,Math.min(2600-H,camera.y));
}

/* DRAW */

function draw(){

 ctx.clearRect(0,0,W,H);

 background();

 for(const o of crystalsList)
  if(!o.got)crystal(o);

 drawPortal();

 for(const p of people){

  const x=p.x-camera.x;
  const y=p.y-camera.y;

  if(x>-70&&x<W+70&&y>-70&&y<H+70)
   human(x,y,p.color,.9,false);
 }

 for(const e of enemies){

  if(e.dead)continue;

  const x=e.x-camera.x;
  const y=e.y-camera.y;

  human(x,y,"#9c2631",1.05,true);

  /* enemy HP bar */

  ctx.fillStyle="#000";
  ctx.fillRect(x-25,y-52,50,6);

  ctx.fillStyle="#ff3b4f";
  ctx.fillRect(
   x-25,
   y-52,
   50*(e.hp/e.maxHp),
   6
  );
 }

 human(
  player.x-camera.x,
  player.y-camera.y,
  "#2478ee",
  1.15,
  false
 );

 if(hitFlash){

  ctx.fillStyle="rgba(255,255,255,.15)";
  ctx.fillRect(0,0,W,H);
 }
}

/* LOOP */

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
